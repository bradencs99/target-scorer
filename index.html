<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BullScore"><title>BullScore – Decimal Target Scoring</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
html,body{margin:0;background:#0f172a;color:#e2e8f0;overscroll-behavior:none;font-family:system-ui,-apple-system,sans-serif}
body{padding-top:env(safe-area-inset-top)}#app{padding:12px 12px calc(76px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;background:#1e293b;display:flex;border-top:1px solid #334155;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;padding:10px 0;font-size:11px;color:#94a3b8}nav button.on{color:#06b6d4}nav b{display:block;font-size:18px}
canvas{touch-action:none;display:block}.c{background:#1e293b;border-radius:14px;padding:12px;margin-bottom:12px}
.b{background:#334155;border-radius:10px;padding:9px 12px;font-size:14px;white-space:nowrap}.p{background:#06b6d4;color:#00222a;font-weight:600}.a{background:#f59e0b;color:#1c1000;font-weight:600}
.r{background:#7f1d1d}input,select,textarea{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px;width:100%;color:#e2e8f0;font-size:16px;margin:4px 0 8px}
label{font-size:12px;color:#94a3b8}h2{font-weight:700;font-size:17px;margin-bottom:6px}.pill{background:#0f172a;border-radius:99px;padding:3px 9px;font-size:12px}
</style></head><body><div id="app"></div>
<nav id="nav"></nav>
<input type="file" id="fc" accept="image/*" capture="environment" hidden><input type="file" id="fg" accept="image/*" hidden><input type="file" id="fr" accept="application/json" hidden>
<script>
const T={
sfc:{n:'SFC 20-Yard Match Rifle (No. 134)',s:'20yd .22',cal:5.6,d10:2.75,w:4.2,rmin:4,rng:18.288,sb:1},
ccm:{n:'CCM 10m Air Rifle (CCT2001AR853)',s:'10m .177',cal:4.5,d10:1,w:2.5,rmin:4,rng:10,sb:0},
air:{n:'ISSF 10m Air Rifle (10-Bull)',s:'10m .177',cal:4.5,d10:.5,w:2.5,rmin:4,rng:10,sb:0},
sm50:{n:'ISSF 50m Smallbore',s:'50m .22',cal:5.6,d10:10.4,w:8,rmin:3,rng:50,sb:1}};
for(const k in T){const t=T[k];t.mark=t.d10+2*(10-t.rmin)*t.w}
const POS=[[0,0],[0,1],[0,2],[0,3],[1,0],[1,3],[2,0],[2,1],[2,2],[2,3],[1,1],[1,2]];
const $=i=>document.getElementById(i),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),O=(a,f)=>a.map(f).join(''),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fmt=v=>v.toFixed(1),
today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),
dl=(d,o)=>new Date(d+'T12:00').toLocaleDateString('en-CA',o),lb=i=>i<10?i+1:'S'+(i-9);
const S={tab:0,p:[],s:[],act:null,sid:null,ci:0,day:'all',open:null,an:{p:'',t:'',l:''}};
const E={mode:'sheet',bi:0,tool:'plug',v:{x:0,y:0,k:1},src:null,sid:null,dpr:1,cw:300,ch:300};
const sess=()=>S.s.find(x=>x.id===S.sid),prof=id=>S.p.find(p=>p.id===id);
/* ---------- storage ---------- */
let db;const open=()=>new Promise((r,j)=>{const q=indexedDB.open('bullscore',1);q.onupgradeneeded=()=>q.result.createObjectStore('d',{keyPath:'id'});q.onsuccess=()=>{db=q.result;r()};q.onerror=j});
const put=o=>{try{db.transaction('d','readwrite').objectStore('d').put(o)}catch(e){console.error(e)}},del=id=>db.transaction('d','readwrite').objectStore('d').delete(id),
all=()=>new Promise(r=>{const q=db.transaction('d').objectStore('d').getAll();q.onsuccess=()=>r(q.result)}),meta=()=>put({id:'meta',k:'m',act:S.act});
/* ---------- scoring ---------- */
function sc(t,d){const e=Math.max(0,d-t.cal/2),R=t.d10/2;let s;
if(e<=R)s=10.9-.9*e/R;else{const k=10-Math.ceil((e-R)/t.w);if(k<1)return 0;s=k+.9*(R+(10-k)*t.w-e)/t.w}
return Math.min(10.9,Math.floor(s*10+1e-9)/10)}
function shotInfo(t,c,i){const s=c.shots[i],b=c.bulls[i];if(!s||!b)return null;const dx=(s.x-b.x)/c.ppm,dy=(b.y-s.y)/c.ppm,d=Math.hypot(dx,dy);return{dx,dy,d,v:sc(t,d)}}
function cardTot(c,t){let v=0,n=0,x=0,ii=0;for(let i=0;i<10;i++){const q=shotInfo(t,c,i);if(q){v+=q.v;n++;ii+=Math.floor(q.v);if(q.v>=10.5)x++}}return{v:Math.round(v*10)/10,n,i:ii,x}}
const sesTot=se=>{const t=T[se.t];return se.cards.reduce((a,c)=>{const q=cardTot(c,t);a.v+=q.v;a.n+=q.n;a.i+=q.i;a.x+=q.x;return a},{v:0,n:0,i:0,x:0})};
const pts=se=>se.cards.flatMap(c=>{const t=T[se.t],o=[];for(let i=0;i<10;i++){const q=shotInfo(t,c,i);if(q)o.push(q)}return o});
function grp(P){if(!P.length)return null;const mx=P.reduce((a,p)=>a+p.dx,0)/P.length,my=P.reduce((a,p)=>a+p.dy,0)/P.length;return{mx,my,r:P.reduce((a,p)=>a+Math.hypot(p.dx-mx,p.dy-my),0)/P.length}}
const clab=(se,i)=>se.fmt==='cadet2'?['Prone','Standing'][i]||'C'+(i+1):'C'+(i+1);
/* ---------- svg helpers ---------- */
function cloud(P,t,z,adv){const R=t.mark/2,g=grp(P),sx=z/2/R;let h=`<svg viewBox="0 0 ${z} ${z}" width="${z}" height="${z}" style="background:#0f172a;border-radius:10px">`;
for(let k=t.rmin;k<=10;k+=k<7?1:1)h+=`<circle cx="${z/2}" cy="${z/2}" r="${(t.d10/2+(10-k)*t.w)*sx}" fill="none" stroke="#06b6d4" stroke-opacity=".45" stroke-width=".8"/>`;
h+=O(P,p=>`<circle cx="${z/2+p.dx*sx}" cy="${z/2-p.dy*sx}" r="${Math.max(1.5,t.cal/2*sx)}" fill="#f59e0b" fill-opacity=".6"/>`);
if(g)h+=`<path d="M${z/2+g.mx*sx-8} ${z/2-g.my*sx}h16M${z/2+g.mx*sx} ${z/2-g.my*sx-8}v16" stroke="#fff" stroke-width="1.5"/>`;return h+'</svg>'}
function advice(P,t,se){const g=grp(P);if(!g)return'';const sr=+se.eq?.sr;let h=`<div class="text-sm">MPI: ${g.mx.toFixed(2)} / ${g.my.toFixed(2)} mm (x/y) · Mean group radius: <b class="text-amber-400">${g.r.toFixed(2)} mm</b></div>`;
if(sr&&Math.hypot(g.mx,g.my)>.05){const f=sr/(t.rng*1000),x=-g.mx*f,y=-g.my*f;h+=`<div class="text-sm text-cyan-300">Move rear sight ${x>=0?'right':'left'} ${Math.abs(x).toFixed(3)} mm, ${y>=0?'up':'down'} ${Math.abs(y).toFixed(3)} mm (sight radius ${sr} mm)</div>`}else if(!sr)h+='<div class="text-xs text-slate-400">Add a sight radius to the equipment setup for click advice.</div>';return h}
/* ---------- views ---------- */
function render(){const v=[score,sessions,analytics,profiles][S.tab]();$('app').innerHTML=v;
$('nav').innerHTML=O(['🎯 Score Card','📅 Sessions','📈 Analytics','👤 Profiles'],(n,i)=>`<button data-a="tab" data-i="${i}" class="${i==S.tab?'on':''}"><b>${n.slice(0,2)}</b>${n.slice(3)}</button>`);
if(S.tab==0&&sess()&&sess().cards[S.ci]?.img)initCv()}
const fmtOpts=k=>T[k].sb?'<option value=6>6-Card Match (60 shots)</option><option value=4>4-Card (40 shots)</option><option value=1>Single Card (10 shots)</option>':'<option value=1>Single Card (10 shots)</option><option value=cadet2>2-Card Cadet Match (10 Prone + 10 Standing)</option>';
function addpForm(){return`<div class=c><h2>Create your first shooter profile</h2><p class="text-sm text-slate-400 mb-2">Add an athlete or cadet. You can add rifle and ammo setups later in Profiles.</p><input id=pn placeholder="Shooter name"><button data-a=addp class="b p w-full">Create profile</button></div>`}
function score(){if(!S.p.length)return addpForm();const se=sess();if(!se){const p=prof(S.act)||S.p[0];
return`<div class=c><h2>New session</h2><label>Shooter</label><select id=np data-a=pchg>${O(S.p,x=>`<option value=${x.id} ${x.id==p.id?'selected':''}>${esc(x.name)}</option>`)}</select>
<label>Target</label><select id=nt onchange="$('nf').innerHTML=fmtOpts(this.value)">${O(Object.keys(T),k=>`<option value=${k}>${T[k].n}</option>`)}</select>
<label>Format</label><select id=nf>${fmtOpts('sfc')}</select><label>Equipment / ammo lot</label><select id=ne><option value="">None</option>${O(p.eq,e=>`<option value=${e.id}>${esc(e.rifle)} · ${esc(e.lot)}</option>`)}</select>
<label>Date</label><input type=date id=nd value="${today()}"><label>Notes</label><textarea id=nn rows=2 placeholder="Range conditions, position adjustments"></textarea>
<button data-a=start class="b p w-full">Start scoring</button></div>`}
const t=T[se.t],c=se.cards[S.ci],tot=sesTot(se);
let h=`<div class=c><div class="flex justify-between items-start"><div><b>${esc(prof(se.pid)?.name)}</b> <span class=pill>${t.s}</span><div class="text-xs text-slate-400">${dl(se.date,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}${se.eq?' · '+esc(se.eq.rifle)+' '+esc(se.eq.lot):''}</div></div><button data-a=done class=b>Close</button></div>
<div class="flex gap-2 overflow-x-auto mt-2">${O(se.cards,(x,i)=>`<button data-a=ci data-i=${i} class="b ${i==S.ci?'p':''}">${clab(se,i)}: ${fmt(cardTot(x,t).v)}</button>`)}<button data-a=addc class=b>+ Add Another Card</button></div>
<div class="mt-2 text-sm">Total <b class="text-cyan-400 text-xl">${fmt(tot.v)}</b> / ${fmt(se.cards.length*109)} · ${tot.i} · ${tot.x}X</div></div>`;
if(!c.img)return h+`<div class=c><h2>${clab(se,S.ci)}: add a photo of the full sheet</h2><p class="text-sm text-slate-400 mb-2">Lay the sheet flat, shoot straight on in even light.</p><div class="flex gap-2"><button data-a=cam class="b p flex-1">📷 Take photo</button><button data-a=gal class="b flex-1">🖼 Gallery</button></div></div>`;
const P=pts({...se,cards:[c]}),PA=pts(se);
return h+`<div class=c style="padding:8px"><div style="position:relative"><canvas id=cv style="width:100%;height:52vh;background:#000;border-radius:10px"></canvas><canvas id=lp width=240 height=240 style="position:absolute;top:6px;left:6px;width:120px;height:120px;display:none;border:2px solid #f59e0b;border-radius:14px;pointer-events:none"></canvas></div>
<div id=info class="text-sm my-2"></div>
<div class="flex gap-2 overflow-x-auto"><button data-a=sheet class="b ${E.mode=='sheet'?'p':''}">Step A: Align</button><button data-a=nx data-d=-1 class=b>◀ Prev</button><button data-a=nx data-d=1 class=b>Next ▶</button>
${O([['ring','Rings'],['plug','Plug'],['grid','Grid']],([k,n])=>`<button data-a=tl data-k=${k} class="b ${E.tool==k?'a':''}">${n}</button>`)}</div>
<div class="flex gap-2 overflow-x-auto mt-2">${O([['0,-1','↑'],['0,1','↓'],['-1,0','←'],['1,0','→']],([d,n])=>`<button data-a=nu data-d="${d}" class=b>${n}</button>`)}<button data-a=sc data-d=.98 class=b>Scale −</button><button data-a=sc data-d=1.02 class=b>Scale +</button><button data-a=dt class=b>Re-detect sheet</button><button data-a=dh class=b>Detect hole</button><button data-a=cam class=b>📷 Retake</button><button data-a=gal class=b>🖼</button></div></div>
<div class=c><h2>Shot cloud</h2><div class="flex gap-3 items-start">${cloud(P,t,150)}<div class="space-y-1">${advice(P,t,se)}</div></div>${se.cards.length>1?`<div class="text-xs text-slate-400 mt-3">All cards</div><div class="flex gap-3">${cloud(PA,t,110)}<div>${advice(PA,t,se)}</div></div>`:''}</div>
<div class=c><h2>Shots</h2><div class="grid grid-cols-5 gap-1 text-center text-sm">${O([...Array(10).keys()],i=>{const q=shotInfo(t,c,i);return`<button data-a=fc data-i=${i} class=b style="padding:6px 2px">${i+1}<br><b class="${q&&q.v>=10.5?'text-amber-400':''}">${q?fmt(q.v):'–'}</b></button>`})}</div></div>`}
function sessions(){const days=[...new Set(S.s.map(s=>s.date))].sort().reverse();
if(!days.length)return`<div class=c><h2>No sessions yet</h2><p class="text-sm text-slate-400">Scored cards appear here by date. Start one in the Score Card tab.</p></div>`;
const cnt=d=>S.s.filter(s=>s.date==d).reduce((a,s)=>a+s.cards.filter(c=>cardTot(c,T[s.t]).n).length,0);
let h=`<div class="flex gap-2 overflow-x-auto pb-2 mb-2"><button data-a=day data-d=all class="b ${S.day=='all'?'p':''}">Show All Dates</button>${O(days,d=>`<button data-a=day data-d=${d} class="b ${S.day==d?'p':''}">${dl(d,{month:'short',day:'numeric'})} <span class=pill>${cnt(d)}</span></button>`)}</div>`;
return h+O(S.day=='all'?days:[S.day],d=>{const L=S.s.filter(s=>s.date==d),hi=Math.max(0,...L.flatMap(s=>s.cards.map(c=>cardTot(c,T[s.t]).v)));
return`<div class="text-sm font-semibold text-slate-300 my-2">${dl(d,{weekday:'long',month:'short',day:'numeric',year:'numeric'})} — Daily High: ${fmt(hi)}</div>`+O(L,s=>{const t=T[s.t],q=sesTot(s),op=S.open==s.id;
return`<div class=c><div data-a=op data-i=${s.id}><div class="flex justify-between"><div><span class=pill>${t.s}</span> <b>${esc(prof(s.pid)?.name)}</b><div class="text-xs text-slate-400">${s.eq?esc(s.eq.rifle)+' · '+esc(s.eq.lot):'No equipment'}</div></div><div class=text-right><div class="text-3xl font-bold text-cyan-400">${fmt(q.v)}</div><div class="text-xs">${q.i} · ${q.x}X</div></div></div>
<div class="flex gap-1 flex-wrap my-2">${O(s.cards,(c,i)=>`<span class=pill>${clab(s,i)}: ${fmt(cardTot(c,t).v)}</span>`)}</div>${cloud(pts(s),t,90)}</div>
${op?`<div class="mt-2 text-sm">${s.notes?`<p class="text-slate-400 mb-2">${esc(s.notes)}</p>`:''}${O(s.cards,(c,ci)=>`<div class="mb-2"><b>${clab(s,ci)}</b> ${O([...Array(10).keys()],i=>{const x=shotInfo(t,c,i);return`<span class=pill>${i+1}: ${x?fmt(x.v):'–'}</span> `})}</div>`)}<div class="flex gap-2"><button data-a=edit data-i=${s.id} class="b p">Open / edit rings</button><button data-a=dels data-i=${s.id} class="b r">Delete</button></div></div>`:''}</div>`})})}
function analytics(){const f=S.an,lots=[...new Set(S.s.map(s=>s.eq?.lot).filter(Boolean))];
const L=S.s.filter(s=>(!f.p||s.pid==f.p)&&(!f.t||s.t==f.t)&&(!f.l||s.eq?.lot==f.l)&&sesTot(s).n).sort((a,b)=>a.date<b.date?-1:1);
const sel=(k,o)=>`<select data-a=flt data-k=${k} style="width:auto">${o}</select>`;
let h=`<div class="c flex gap-2 flex-wrap">${sel('p','<option value="">All shooters</option>'+O(S.p,p=>`<option value=${p.id} ${f.p==p.id?'selected':''}>${esc(p.name)}</option>`))}${sel('t','<option value="">All targets</option>'+O(Object.keys(T),k=>`<option value=${k} ${f.t==k?'selected':''}>${T[k].s}</option>`))}${sel('l','<option value="">All ammo lots</option>'+O(lots,l=>`<option ${f.l==l?'selected':''}>${esc(l)}</option>`))}</div>`;
if(!L.length)return h+'<div class=c><h2>No scored shots match</h2><p class="text-sm text-slate-400">Score a card, or loosen the filters. Mixing disciplines is blocked on purpose: filter one target at a time for clean trends.</p></div>';
const avg=L.map(s=>sesTot(s).v/sesTot(s).n),rad=L.map(s=>grp(pts(s)).r),W=320,H=120;
const ln=(v,col)=>{const mx=Math.max(...v),mn=Math.min(...v),xy=v.map((a,i)=>[v.length>1?10+i*(W-20)/(v.length-1):W/2,H-10-(a-mn)/((mx-mn)||1)*(H-20)]);return`<polyline fill=none stroke="${col}" stroke-width=2 points="${xy.map(p=>p.join(',')).join(' ')}"/>`+O(xy,p=>`<circle cx=${p[0]} cy=${p[1]} r=3 fill="${col}"/>`)};
h+=`<div class=c><h2>Trend by date</h2><svg viewBox="0 0 ${W} ${H}" class="w-full">${ln(avg,'#06b6d4')}${ln(rad,'#f59e0b')}</svg><div class="text-xs"><span class=text-cyan-400>● Avg shot ${avg[avg.length-1].toFixed(2)}</span> <span class=text-amber-400>● Mean radius ${rad[rad.length-1].toFixed(2)} mm</span> (latest) · ${dl(L[0].date,{month:'short',day:'numeric'})} → ${dl(L[L.length-1].date,{month:'short',day:'numeric'})}</div></div>`;
const bars=(v,lab,col)=>{const m=Math.max(...v,1),bw=W/v.length;return`<svg viewBox="0 0 ${W} ${H+16}" class="w-full">${O(v,(a,i)=>`<rect x=${i*bw+4} y=${H-a/m*(H-14)} width=${bw-8} height=${a/m*(H-14)} fill="${col}" rx=3 /><text x=${i*bw+bw/2} y=${H-a/m*(H-14)-3} fill="#e2e8f0" font-size=9 text-anchor=middle>${a%1?a.toFixed(1):a}</text><text x=${i*bw+bw/2} y=${H+12} fill="#94a3b8" font-size=9 text-anchor=middle>${lab[i]}</text>`)}</svg>`};
const mc=Math.max(...L.map(s=>s.cards.length)),st=[...Array(mc).keys()].map(i=>{const a=L.filter(s=>s.cards[i]&&cardTot(s.cards[i],T[s.t]).n).map(s=>cardTot(s.cards[i],T[s.t]).v);return a.length?a.reduce((x,y)=>x+y,0)/a.length:0});
h+=`<div class=c><h2>String breakdown (avg per card)</h2>${bars(st,st.map((_,i)=>L.some(s=>s.fmt=='cadet2')&&mc==2?['Prone','Standing'][i]:'C'+(i+1)),'#06b6d4')}</div>`;
const bn=[0,0,0,0];L.forEach(s=>pts(s).forEach(p=>bn[p.v>=10.5?0:p.v>=10?1:p.v>=9.5?2:3]++));
return h+`<div class=c><h2>Score distribution</h2>${bars(bn,['10.5+','10.0–10.4','9.5–9.9','<9.5'],'#f59e0b')}</div>`}
function profiles(){return`<div class=c><h2>Shooter profiles</h2><div class=flex><input id=pn placeholder="New shooter name"><button data-a=addp class="b p ml-2" style="margin-bottom:8px">Add</button></div></div>`+
O(S.p,p=>`<div class=c><div class="flex justify-between items-center"><b>${esc(p.name)} ${p.id==S.act?'<span class=pill>Active</span>':''}</b><div class="flex gap-1"><button data-a=act data-i=${p.id} class=b>Use</button><button data-a=ren data-i=${p.id} class=b>Edit</button><button data-a=delp data-i=${p.id} class="b r">✕</button></div></div>
<div class="text-sm mt-2">${O(p.eq,e=>`<div class="flex justify-between py-1 border-b border-slate-700"><span>${esc(e.rifle)} · SR ${esc(e.sr)} mm · ${esc(e.lot)}</span><span><button data-a=eqe data-p=${p.id} data-i=${e.id}>✎</button> <button data-a=eqd data-p=${p.id} data-i=${e.id}>✕</button></span></div>`)}<button data-a=eqa data-i=${p.id} class="b mt-2">+ Equipment setup</button></div></div>`)+
`<div class=c><h2>Backup</h2><div class="grid grid-cols-2 gap-2"><button data-a=exj class=b>Export JSON</button><button data-a=imj class=b>Restore JSON</button><button data-a=exc class="b col-span-2">Export history CSV</button></div><p class="text-xs text-slate-400 mt-2">Everything is stored on this device in IndexedDB, and works offline.</p></div>`}
/* ---------- canvas editor ---------- */
function initCv(){const cv=$('cv'),r=cv.getBoundingClientRect(),d=E.dpr=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;E.cw=r.width;E.ch=r.height;ptr(cv);const c=sess().cards[S.ci];
if(E.sid!==c.id){E.sid=c.id;E.mode='sheet';E.src=null;const im=new Image;im.onload=()=>{E.src=im;fitSheet();if(!c.bulls.length)autoSheet(c,T[sess().t]);draw();updInfo()};im.src=c.img}else{draw();updInfo()}}
function fitSheet(){const k=Math.min(E.cw/E.src.naturalWidth,E.ch/E.src.naturalHeight);E.v={k,x:(E.cw-E.src.naturalWidth*k)/2,y:(E.ch-E.src.naturalHeight*k)/2}}
function fitBull(){const c=sess().cards[S.ci],t=T[sess().t],b=c.bulls[E.bi],k=Math.min(E.cw,E.ch)/2/(t.mark/2*c.ppm*1.15);E.v={k,x:E.cw/2-b.x*k,y:E.ch/2-b.y*k}}
function draw(){const cv=$('cv');if(!cv||!E.src)return;const g=cv.getContext('2d'),se=sess(),t=T[se.t],c=se.cards[S.ci],d=E.dpr,v=E.v;

function ptr(cv){const P=new Map;let tg,mv,tap,last;const rp=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}},

function blobs(d,w,h,f){const v=new Uint8Array(w*h),o=[];for(let s=0;s<w*h;s++){if(v[s]||!f(d,s*4))continue;const st=[s];let a=0,sx=0,sy=0,x0=w,x1=0,y0=h,y1=0;v[s]=1;

function autoSheet(c,t){const im=E.src,iw=im.naturalWidth,ih=im.naturalHeight,f=Math.max(iw,ih)/500,w=Math.round(iw/f),h=Math.round(ih/f),q=document.createElement('canvas');q.width=w;q.height=h;const g=q.getContext('2d');g.drawImage(im,0,0,w,h);
